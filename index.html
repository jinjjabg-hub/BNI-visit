<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI AI Builder</title>
<style>
  :root{
    --navy:#12203A; --ink:#1C1C1C; --mute:#5B5B57;
    --bg:#F5F4F0; --card:#FFFFFF; --accent:#2E5FA3; --gold:#C9A227;
    --line:#E4E1D8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .brand b{font-size:20px;color:var(--navy);letter-spacing:.5px;}
  .brand span{font-size:13px;color:var(--mute);}
  h1{font-size:16px;margin:14px 0 2px;color:var(--navy);}
  p.sub{font-size:13px;color:var(--mute);margin:0 0 18px;line-height:1.5;}
  .panel{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line);}
  label{display:block;font-size:12.5px;color:var(--mute);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input,select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #D8D5CB;font-size:15px;background:#FBFAF7;color:var(--ink);font-family:inherit;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .hint{font-size:11.5px;color:#9A9890;margin-top:5px;}
  button.primary{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:var(--navy);color:white;font-size:15px;font-weight:600;cursor:pointer;}
  button.ghost{width:100%;margin-top:10px;padding:11px;border:1px solid #D8D5CB;border-radius:10px;background:transparent;color:var(--mute);font-size:13.5px;cursor:pointer;}
  .status{font-size:13px;color:#B23; margin-top:10px;text-align:center;min-height:16px;}
  .result{margin-top:22px;}
  .hidden{display:none;}
  .card{background:var(--card);border-radius:16px;padding:14px 10px 18px;border:1px solid var(--line);}
  .section-title{font-size:13px;font-weight:700;color:var(--navy);margin:22px 0 10px 2px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:#EAF0FB;color:var(--accent);border:1px solid #C9D9F2;border-radius:20px;padding:6px 12px;font-size:12.5px;}
  .chip.empty{background:#FFF7E0;color:#8A6D00;border-color:#E9CE7A;font-weight:700;}
  .pitch{margin-top:12px;background:var(--navy);color:#EAF0FF;border-radius:12px;padding:16px;font-size:14px;line-height:1.65;}
  .pitch b{color:#FFD97A;}
  svg text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.4}}
  .empty-seat{animation:pulse 1.8s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){.empty-seat{animation:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>T.M LINK</b><span>· BNI AI Builder v1</span></div>
  <h1>전문분야 + 핵심고객만 입력하세요</h1>
  <p class="sub">방문자의 직종과, 그 방문자가 상대하는 주 고객을 넣으면 션샤인 · 파워팀 · 30초 소개가 규칙 기반으로 즉시 만들어집니다. (매번 AI를 부르지 않아서 결과가 항상 일정합니다)</p>

  <div class="panel">
    <label for="persona">핵심 고객 (페르소나)</label>
    <select id="persona"></select>

    <label for="profession">방문자의 전문분야</label>
    <input id="profession" list="jobList" placeholder="예: 세무사, 부동산중개사, 관세사...">
    <datalist id="jobList"></datalist>
    <div class="hint">목록에 없어도 괜찮아요. 자유롭게 입력하면 됩니다.</div>

    <label for="chapter">챕터 이름 (선택)</label>
    <input id="chapter" placeholder="예: BNI Pioneer">

    <label for="note">추가설명 (선택, 다음 버전에서 추천 이유 생성에 활용 예정)</label>
    <input id="note" placeholder="예: 중국어 바이어를 많이 만남">

    <button class="primary" onclick="generateCard()">생성하기</button>
    <div class="status" id="status"></div>
  </div>

  <div class="result hidden" id="result"></div>
</div>

<script>
// ===== 규칙 데이터 (v1: 여기에 계속 추가하면 결과 품질이 좋아집니다) =====
const PERSONAS = {
  "해외전시회 참가 중소기업 대표": {
    needs: ["T.M LINK 디지털명함","브랜딩디자이너","기업사진작가","홍보영상제작","홈페이지제작자","번역·통역","해외마케팅SEO","관세사","국제물류","무역컨설턴트","특허전문가","세무사"],
    power_team: ["T.M LINK 디지털명함","홈페이지제작자","번역·통역","무역컨설턴트","관세사","국제물류"],
    intro: "해외 바이어를 만나는 대표님들이 통관부터 번역까지 한 번에 연결되는 팀입니다."
  },
  "이사하는 신혼부부": {
    needs: ["부동산중개사","인테리어업체","이사업체","은행(주택담보대출)","보험설계사","가전·가구업체","웨딩플래너","법무사(등기)","청소업체","인테리어디자이너"],
    power_team: ["부동산중개사","인테리어업체","은행(주택담보대출)","법무사(등기)","보험설계사","이사업체"],
    intro: "신혼집을 구하는 순간부터 입주까지, 한 팀이 모든 걸 연결해드립니다."
  },
  "창업 준비 중인 스타트업 대표": {
    needs: ["브랜딩디자이너","홈페이지제작자","세무사","노무사","변호사(법인설립)","투자컨설턴트","특허전문가","마케팅대행사","회계사","IR피치덱제작"],
    power_team: ["브랜딩디자이너","홈페이지제작자","세무사","노무사","변호사(법인설립)","회계사"],
    intro: "법인 설립부터 브랜딩까지, 창업 초기에 꼭 필요한 파트너들입니다."
  },
  "제조업 대표": {
    needs: ["산업안전컨설턴트","노무사","세무사","회계사","전기공사업체","시설관리(FM)","보험설계사","물류업체","홍보영상제작","홈페이지제작자"],
    power_team: ["산업안전컨설턴트","노무사","세무사","전기공사업체","시설관리(FM)","보험설계사"],
    intro: "공장을 운영하는 대표님께 안전·인사·세무까지 한 번에 연결됩니다."
  },
  "개원 준비 의료인": {
    needs: ["인테리어업체","세무사","노무사","의료기기업체","홈페이지제작자","마케팅대행사","보험설계사","회계사","간판·인쇄업체","브랜딩디자이너"],
    power_team: ["인테리어업체","세무사","홈페이지제작자","마케팅대행사","간판·인쇄업체","브랜딩디자이너"],
    intro: "개원 준비부터 홍보까지, 원장님 곁에 필요한 파트너들입니다."
  },
  "프랜차이즈 창업자": {
    needs: ["인테리어업체","간판·인쇄업체","세무사","마케팅대행사","보험설계사","홈페이지제작자","POS업체","식자재유통업체","브랜딩디자이너","노무사"],
    power_team: ["인테리어업체","간판·인쇄업체","세무사","마케팅대행사","POS업체","노무사"],
    intro: "매장을 오픈하는 순간부터 운영까지, 함께 움직이는 팀입니다."
  }
};

const JOB_SUGGESTIONS = ["T.M LINK 디지털명함","세무사","노무사","변호사","보험설계사","부동산중개사","인테리어업체",
  "사진작가","영상제작자","마케팅대행사","관세사","국제물류","무역컨설턴트","브랜딩디자이너","홈페이지제작자",
  "건축사","회계사","시설관리(FM)","산업안전컨설턴트","전기공사업체","법무사","간판·인쇄업체"];

// ===== 초기화 =====
const personaSelect = document.getElementById("persona");
Object.keys(PERSONAS).forEach(key=>{
  const opt = document.createElement("option");
  opt.value = key; opt.textContent = key;
  personaSelect.appendChild(opt);
});
const jobList = document.getElementById("jobList");
JOB_SUGGESTIONS.forEach(j=>{
  const opt = document.createElement("option");
  opt.value = j;
  jobList.appendChild(opt);
});

function norm(s){ return String(s).replace(/\s|\(|\)|·/g,'').toLowerCase(); }

function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function buildSVG(personaLabel, needs, emptyIndex){
  const cx = 200, cy = 220, R = 58, orbit = 152, satR = 40;
  const n = needs.length;
  let satellites = "";
  needs.forEach((name, i) => {
    const angle = i * (360 / n);
    const [sx, sy] = polar(cx, cy, orbit, angle);
    const [lx, ly] = polar(cx, cy, R + 4, angle);
    const isEmpty = i === emptyIndex;
    const stroke = isEmpty ? "#C9A227" : "#2E5FA3";
    const fill = isEmpty ? "#FFF7E0" : "#FFFFFF";
    const dash = isEmpty ? `stroke-dasharray="4 3"` : "";
    const cls = isEmpty ? "empty-seat" : "";
    const label = name.length > 7 ? name.slice(0,7) : name;
    satellites += `<line x1="${lx}" y1="${ly}" x2="${sx}" y2="${sy}" stroke="${stroke}" stroke-width="1" opacity="0.5"/>`;
    satellites += `<g class="${cls}">
      <circle cx="${sx}" cy="${sy}" r="${satR}" fill="${fill}" stroke="${stroke}" stroke-width="${isEmpty?2:1.2}" ${dash}/>
      <text x="${sx}" y="${sy + (isEmpty?-2:3)}" font-size="10" font-weight="700" text-anchor="middle" fill="${isEmpty?'#8A6D00':'#12203A'}">${label}</text>
      ${isEmpty ? `<text x="${sx}" y="${sy+12}" font-size="8" text-anchor="middle" fill="#8A6D00">자리 비어있음</text>` : ""}
    </g>`;
  });
  return `<svg width="100%" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
    ${satellites}
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="#12203A"/>
    <text x="${cx}" y="${cy-8}" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">${personaLabel.length>9?personaLabel.slice(0,9)+'…':personaLabel}</text>
    <text x="${cx}" y="${cy+10}" font-size="9" text-anchor="middle" fill="#CFE0FF">필요한 파트너</text>
  </svg>`;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function generateCard(){
  const personaKey = personaSelect.value;
  const profession = document.getElementById("profession").value.trim();
  const chapter = document.getElementById("chapter").value.trim() || "저희 챕터";
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if(!profession){
    status.textContent = "방문자의 전문분야를 입력해주세요.";
    return;
  }
  status.textContent = "";

  const persona = PERSONAS[personaKey];
  let needs = [...persona.needs];
  let matchIdx = needs.findIndex(item => norm(item).includes(norm(profession)) || norm(profession).includes(norm(item)));
  if(matchIdx === -1){
    needs = [profession, ...needs];
    matchIdx = 0;
  }

  const svg = buildSVG(personaKey, needs, matchIdx);
  const powerTeamChips = persona.power_team.map(pt => {
    const isVisitor = norm(pt).includes(norm(profession)) || norm(profession).includes(norm(pt));
    return `<span class="chip${isVisitor ? ' empty' : ''}">${escapeHTML(pt)}</span>`;
  }).join("");

  const introTemplate = `저는 <b>${escapeHTML(profession)}</b>입니다. ${escapeHTML(persona.intro)}<br><br>
  <b>${escapeHTML(personaKey)}</b> 고객군에서 지금 <b>${escapeHTML(profession)} 자리가 비어있습니다.</b><br><br>
  ${escapeHTML(chapter)}에서 이 자리를 함께 채워보시겠어요?`;

  result.innerHTML = `
    <div class="card">${svg}</div>
    <div class="section-title">파워팀 (실제 협업 핵심 그룹)</div>
    <div class="chips">${powerTeamChips}</div>
    <div class="pitch">${introTemplate}</div>
    <button class="ghost" onclick="resetForm()">다른 방문자로 다시 만들기</button>
  `;
  result.classList.remove("hidden");
}

function resetForm(){
  document.getElementById("profession").value = "";
  document.getElementById("note").value = "";
  document.getElementById("result").classList.add("hidden");
  document.getElementById("status").textContent = "";
  document.getElementById("profession").focus();
}
</script>
</body>
</html>
